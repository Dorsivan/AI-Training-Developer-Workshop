apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-a-cluster-queue
spec:
  cohortName: gpu-cohort
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
    borrowWithinCohort:
      policy: LowerPriority
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: default-flavor
          resources:
            - name: "cpu"
              nominalQuota: 16
            - name: "memory"
              nominalQuota: "64Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: 1
              borrowingLimit: 1
              lendingLimit: 1
---
