pipelineInfo:
  description: KFP pipeline demonstrating Kueue CPU quota queuing. Three parallel
    training tasks compete for limited CPU quota.
  name: kfp-kueue-cpu-demo
root:
  dag:
    tasks:
      evaluate:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - train
        - train-2
        - train-3
        inputs:
          parameters:
            pipelinechannel--train-2-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train-2
            pipelinechannel--train-3-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train-3
            pipelinechannel--train-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train
            results:
              runtimeValue:
                constant:
                - '{{$.inputs.parameters[''pipelinechannel--train-Output'']}}'
                - '{{$.inputs.parameters[''pipelinechannel--train-2-Output'']}}'
                - '{{$.inputs.parameters[''pipelinechannel--train-3-Output'']}}'
        taskInfo:
          name: evaluate
      preprocess:
        cachingOptions: {}
        componentRef:
          name: comp-preprocess
        taskInfo:
          name: preprocess
      train:
        cachingOptions: {}
        componentRef:
          name: comp-train
        dependentTasks:
        - preprocess
        inputs:
          parameters:
            model_name:
              runtimeValue:
                constant: model-a
        taskInfo:
          name: train
      train-2:
        cachingOptions: {}
        componentRef:
          name: comp-train-2
        dependentTasks:
        - preprocess
        inputs:
          parameters:
            model_name:
              runtimeValue:
                constant: model-b
        taskInfo:
          name: train-2
      train-3:
        cachingOptions: {}
        componentRef:
          name: comp-train-3
        dependentTasks:
        - preprocess
        inputs:
          parameters:
            model_name:
              runtimeValue:
                constant: model-c
        taskInfo:
          name: train-3
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-evaluate:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: team-a-local-queue
        exec-preprocess:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: team-a-local-queue
        exec-train:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: team-a-local-queue
        exec-train-2:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: team-a-local-queue
        exec-train-3:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: team-a-local-queue
